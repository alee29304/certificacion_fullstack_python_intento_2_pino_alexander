{% extends "base.html" %}
{% block titulo %}Editar entrada{% endblock %}
{% block contenido %}
<h1>Editar entrada</h1>

<form action="/entradas/actualizar/{{ entrada.id }}" method="POST">
    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" name="fecha" value="{{ entrada.fecha }}" max="{{ fecha_hoy }}" required>

    <label for="notas">Notas</label>
    <textarea id="notas" name="notas" rows="6" required>{{ entrada.notas }}</textarea>

    <button type="submit">Guardar cambios</button>
</form>

<a href="/entradas">Volver al inicio</a>
{% endblock %}
