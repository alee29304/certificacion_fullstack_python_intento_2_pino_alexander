{% extends "base.html" %}
{% block titulo %}Acceso y registro{% endblock %}
{% block contenido %}
<h1>Bienvenido</h1>

<section>
    <h2>Iniciar sesión</h2>

    <form action="/login" method="POST">
        <label for="correo_login">Correo electrónico</label>
        <input type="email" id="correo_login" name="correo" required>

        <label for="password_login">Contraseña</label>
        <input type="password" id="password_login" name="password" required>

        <button type="submit">Iniciar sesión</button>
    </form>
</section>

<section>
    <h2>Crear cuenta</h2>

    <form action="/registro" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" maxlength="50" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" maxlength="100" required>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="1" max="120" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirmar_password">Confirmar contraseña</label>
        <input type="password" id="confirmar_password" name="confirmar_password" minlength="8" required>

        <button type="submit">Registrarme</button>
    </form>
</section>
{% endblock %}
